name: Profile cards
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify profile assets and privacy boundaries
        run: python3 -m unittest discover -s tests -v

