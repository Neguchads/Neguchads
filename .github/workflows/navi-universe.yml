name: NAVI Universe daily
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_universe.py'
      - 'scripts/showcase.py'
      - 'tests/test_showcase.py'
      - 'docs/showcase.json'
      - 'scripts/core_status.py'
      - 'tests/test_core_status.py'
      - 'scripts/publish_universe.py'
      - 'scripts/verify_hosted.py'
      - 'tests/test_verify_hosted.py'
      - 'tests/test_publish_universe.py'
      - 'docs/universe-pins.json'
      - '.github/workflows/navi-universe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_universe.py'
      - 'scripts/showcase.py'
      - 'tests/test_showcase.py'
      - 'docs/showcase.json'
      - 'scripts/core_status.py'
      - 'tests/test_core_status.py'
      - 'scripts/publish_universe.py'
      - 'scripts/verify_hosted.py'
      - 'tests/test_verify_hosted.py'
      - 'tests/test_publish_universe.py'
      - 'docs/universe-pins.json'
      - '.github/workflows/navi-universe.yml'
permissions:
  contents: read
concurrency:
  group: navi-universe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      pages_artifact: ${{ steps.pages-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Refresh featured cards and build public bundle
        env:
          GH_TOKEN: ${{ github.token }}
          NAVI_PUBLIC_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/refresh_public_cards.py
          python3 scripts/build_universe.py --out /tmp/navi-universe --scan
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navi-universe
          path: /tmp/navi-universe
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Select Pages artifact name
        id: pages-name
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NAVI_ENABLE_PAGES == 'true'
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pages-name.outputs.name != ''
        with:
          path: /tmp/navi-universe
          name: ${{ steps.pages-name.outputs.name }}
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navi-universe
          path: /tmp/navi-universe
      - name: Publish only generated public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 -B scripts/publish_universe.py /tmp/navi-universe
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NAVI_ENABLE_PAGES == 'true'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.pages_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_NAME" =~ ^github-pages-[0-9]+$ ]]
          for attempt in {1..12}; do
            if gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name' |
              grep -Fx "$ARTIFACT_NAME"; then
              echo "Pages artifact is visible through the REST API"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact did not become visible through the API"
          exit 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
          timeout: 600000
          error_count: 15

  hosted-verify:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NAVI_ENABLE_PAGES == 'true'
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: navi-universe
          path: expected-site
      - name: Verify public HTTPS artifact bytes without credentials
        run: python3 -B scripts/verify_hosted.py expected-site
