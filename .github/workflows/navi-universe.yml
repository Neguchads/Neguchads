name: NAVI Universe daily
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_universe.py'
      - 'docs/universe-pins.json'
      - '.github/workflows/navi-universe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_universe.py'
      - 'docs/universe-pins.json'
      - '.github/workflows/navi-universe.yml'
permissions:
  contents: read
concurrency:
  group: navi-universe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.12'
      - name: Refresh featured cards and build public bundle
        env:
          GH_TOKEN: ${{ github.token }}
          NAVI_PUBLIC_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/refresh_public_cards.py
          python3 scripts/build_universe.py --out /tmp/navi-universe --scan
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: navi-universe
          path: /tmp/navi-universe
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: navi-universe
          path: /tmp/navi-universe
      - name: Publish only generated public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p docs/universe
          rm -rf docs/universe/assets
          cp -R /tmp/navi-universe/. docs/universe/
          cp docs/universe/universe.en.svg assets/universe.en.svg
          cp docs/universe/universe.pt-BR.svg assets/universe.pt-BR.svg
          cp docs/universe/assets/projects/*.svg assets/projects/
          git add -- docs/universe assets/universe.en.svg assets/universe.pt-BR.svg assets/projects
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: publish daily NAVI Universe snapshot"
          gh auth setup-git
          git push origin HEAD:main
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NAVI_ENABLE_PAGES == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: navi-universe
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
